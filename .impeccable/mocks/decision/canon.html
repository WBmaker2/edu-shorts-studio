<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#F8FAFC;color:#0F172A;display:grid;grid-template-columns:240px 1fr}
aside{background:#0F172A;color:#CBD5E1;padding:20px 14px;display:flex;flex-direction:column;justify-content:space-between}
.logo{font-size:16px;font-weight:800;color:#fff;padding-bottom:16px;border-bottom:1px solid #1E293B}
.menu{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.m{padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600}
.m.on{background:#2563EB;color:#fff}
main{padding:24px 32px;display:flex;flex-direction:column;gap:18px}
.banner{background:#2563EB;color:#fff;border-radius:16px;padding:22px 26px;display:flex;justify-content:space-between;align-items:center}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:16px}
.box{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:20px;flex:1}
</style>
</head>
<body>
<aside>
  <div>
    <div class="logo">Edu-Shorts Studio</div>
    <div class="menu">
      <div class="m">대시보드</div>
      <div class="m on">교육 쇼츠 제작</div>
      <div class="m">강의 영상 편집</div>
      <div class="m">프리셋 관리</div>
      <div class="m">AI 설정</div>
    </div>
  </div>
  <div style="font-size:12px;color:#64748B">v1.5.0 Standard</div>
</aside>
<main>
  <div class="banner">
    <div><h1 style="font-size:22px;font-weight:800;margin-bottom:4px">교육용 쇼츠 제작 스튜디오</h1><p style="font-size:13px;opacity:.9">학습 주제를 입력하면 AI가 수업 대본과 9:16 영상을 자동으로 제작합니다.</p></div>
    <button style="background:#fff;color:#2563EB;border:none;padding:10px 18px;border-radius:10px;font-weight:800;font-size:13px">새 수업 쇼츠 만들기</button>
  </div>
  <div class="cards">
    <div class="card"><div style="font-size:12px;color:#64748B">총 제작 수업</div><div style="font-size:24px;font-weight:800;margin-top:6px">12편</div></div>
    <div class="card"><div style="font-size:12px;color:#64748B">대본 AI 엔진</div><div style="font-size:18px;font-weight:800;margin-top:6px">내장 교육 AI</div></div>
    <div class="card"><div style="font-size:12px;color:#64748B">음성 합성</div><div style="font-size:18px;font-weight:800;margin-top:6px">한국어 TTS 8종</div></div>
    <div class="card"><div style="font-size:12px;color:#64748B">출력 해상도</div><div style="font-size:18px;font-weight:800;margin-top:6px">1080×1920</div></div>
  </div>
  <div class="box">
    <h3 style="font-size:15px;font-weight:800;margin-bottom:12px">1. 수업 주제 입력</h3>
    <div style="border:1px solid #CBD5E1;border-radius:10px;padding:14px;font-size:14px;margin-bottom:14px">광합성이 일어나는 과정과 엽록체의 역할을 1분 만에 설명하기</div>
    <button style="background:#2563EB;color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:700;font-size:13px">AI 수업 대본 생성</button>
  </div>
</main>
</body>
</html>
